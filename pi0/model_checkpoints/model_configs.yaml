# Model configurations for PI0 Action Server
# Each model has different architectures, action spaces, and loading methods

models:
  pi05_full:
    name: "PI05 Full Action Space"
    description: "PI05 model with full 33-dimensional action space"
    model_type: "pi05"
    paths:
      model: "/home/zordi/openpi/pi0/model_checkpoints/may21/6000/model"
      processor_name: "zordi_pick_strawberry_may20"
      tokenizer: "/home/zordi/openpi/pi0/model_checkpoints/may21/paligemma_tokenizer.model"
    inference:
      function: "sample_actions"  # or "sample_tokens"
      use_diffusion: true
      sampling_kwargs:
        num_denoising_steps: 10
        denoising_schedule_exponent: 1.0
    action_space:
      dimensions: 33
      slicing: null  # Use full action space
    state_space:
      dimensions: 33
      slicing: null  # Use full state space
    loading_method: "restore_exported"

  pi0_ee:
    name: "PI0 End-Effector Space"
    description: "PI0 model with 16-dimensional end-effector action space"
    model_type: "pi0"
    paths:
      model: "/home/zordi/openpi/pi_data/may21_pi0_ee/6000/model"
      processor_name: "zordi_pick_strawberry_may20_ee"
      tokenizer: "/home/zordi/openpi/pi_data/may21_pi0_ee/paligemma_tokenizer.model"
    inference:
      function: "sample_actions"
      use_diffusion: false
      sampling_kwargs:
        num_steps: 10
    action_space:
      dimensions: 16
      # Slices: (left_gripper, left_pose, right_gripper, right_pose)
      slicing:
        - [7, 8]    # left gripper
        - [8, 15]   # left pose (7 dims)
        - [22, 23]  # right gripper
        - [23, 30]  # right pose (7 dims)
    state_space:
      dimensions: 16
      slicing:
        - [7, 8]    # left gripper
        - [8, 15]   # left pose
        - [22, 23]  # right gripper
        - [23, 30]  # right pose
    loading_method: "exported_model"

  pi0_joint:
    name: "PI0 Joint Space"
    description: "PI0 model with 16-dimensional joint action space"
    model_type: "pi0"
    paths:
      model: "/home/zordi/openpi/pi_data/may21_pi0_joint/6000/model"
      processor_name: "zordi_pick_strawberry_may20_joint"
      tokenizer: "/home/zordi/openpi/pi_data/may21_pi0_ee/paligemma_tokenizer.model"
    inference:
      function: "sample_actions"
      use_diffusion: false
      sampling_kwargs:
        num_steps: 10
    action_space:
      dimensions: 16
      # Slices: (left_joints, left_gripper, right_joints, right_gripper)
      slicing:
        - [0, 7]    # left joints (7 dims)
        - [7, 8]    # left gripper
        - [15, 22]  # right joints (7 dims)
        - [22, 23]  # right gripper
    state_space:
      dimensions: 16
      slicing:
        - [0, 7]    # left joints
        - [7, 8]    # left gripper
        - [15, 22]  # right joints
        - [22, 23]  # right gripper
    loading_method: "exported_model"

# Default model to use
default_model: "pi05_full"

# Control parameters (common to all models)
control:
  frequency_hz: 50
  timedelta_sec: 0.02
  observation_length: 1
  actions_per_inference: 25  # Use first 25 of 50 action horizon

# Image configuration (common to all models)
images:
  height: 224
  width: 224
  cameras:
    - "static_center_rgb"
    - "eoat_left_bottom_rgb"
    - "eoat_right_bottom_rgb"
