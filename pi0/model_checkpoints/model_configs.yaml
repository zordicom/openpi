# Default model to use
default_model: "pi05_full"

# Control parameters (common to all models)
control:
  frequency_hz: 50
  timedelta_sec: 0.02
  observation_length: 1
  actions_per_inference: 25  # Use first 25 of 50 action horizon

# Image configuration (common to all models)
images:
  height: 224
  width: 224
  cameras:
    - "static_center_rgb"
    - "eoat_left_bottom_rgb"
    - "eoat_right_bottom_rgb"
