# Model configurations for PI0 Action Server
# Each model has different architectures, action spaces, and loading methods

models:
  pi05_full:
    name: "PI05 Full Action Space"
    description: "PI05 model with full 33-dimensional action space"
    model_type: "pi05"
    paths:
      model: "/home/zordi/zordi_ws/openpi/pi0/model_checkpoints/may21/6000/model"
      processor_name: "zordi_pick_strawberry_may20"
      tokenizer: "/home/zordi/zordi_ws/openpi/pi0/model_checkpoints/may21/paligemma_tokenizer.model"
    inference:
      function: "sample_actions"  # or "sample_tokens"
      use_diffusion: true
      sampling_kwargs:
        num_denoising_steps: 10
        denoising_schedule_exponent: 1.0
    action_space:
      dimensions: 33
      slicing:
        left_arm_joints: [0, 7]    # 7 dims
        left_arm_gripper: [7, 8]
        left_arm_tool_pose: [8, 15]   # 7 dims
        right_arm_joints: [15, 22]  # 7 dims
        right_arm_gripper: [22, 23]
        right_arm_tool_pose: [23, 30]  # 7 dims
        right_arm_tool_to_goal_position: [30, 33]  # 3 dims
    state_space:
      dimensions: 33
      slicing:
        left_arm_joints: [0, 7]    # 7 dims
        left_arm_gripper: [7, 8]
        left_arm_tool_pose: [8, 15]   # 7 dims
        right_arm_joints: [15, 22]  # 7 dims
        right_arm_gripper: [22, 23]
        right_arm_tool_pose: [23, 30]  # 7 dims
        right_arm_tool_to_goal_position: [30, 33]  # 3 dims
    loading_method: "restore_exported"

  pi05_jun21_right_only:
    name: "PI05 Full Action Space"
    description: "PI05 model with joint action space"
    model_type: "pi05"
    paths:
      model: "/home/allen/workspace/openpi/pi0/model_checkpoints/zordi_jun21_joint_right_arm_only_very_low_gemma_loss/10000/model"
      processor_name: "zordi_jun13data_joint_right_arm_only"
      tokenizer: "/home/allen/workspace/openpi/pi0/model_checkpoints/may21_pi0_ee/paligemma_tokenizer.model"
    inference:
      function: "sample_actions"  # or "sample_tokens"
      use_diffusion: true
      sampling_kwargs:
        num_denoising_steps: 10
        denoising_schedule_exponent: 1.0
    action_space:
      dimensions: 8
      # Slices: (right_joints, right_gripper)
      slicing:
        right_arm_joints: [0, 7]  # 7 dims
        right_arm_gripper: [7, 8]
    state_space:
      dimensions: 8
      slicing:
        right_arm_joints: [0, 7]  # 7 dims
        right_arm_gripper: [7, 8]
    loading_method: "restore_exported"

  pi05_jun21_right_only_ee:
    name: "PI05 Full Action Space"
    description: "PI05 model with ee action space"
    model_type: "pi05"
